name: Verify web studio and worker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bundle-models:dry-run
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check native render fallback against the exported song project
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          npm run render:native -- test-results/*/proof.vidlyricsproject "$RUNNER_TEMP/native.mp4" test-results/*/melody.wav
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$RUNNER_TEMP/native.mp4")" = 36
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$RUNNER_TEMP/native.mp4")" = aac
          ffmpeg -v error -i test-results/*/browser.mp4 -i "$RUNNER_TEMP/native.mp4" -lavfi "ssim=stats_file=$RUNNER_TEMP/compare.log" -f null -
          awk '{split($5,a,":"); if (a[2]+0 < 0.93) exit 1} END {if (NR != 36) exit 1}' "$RUNNER_TEMP/compare.log"
