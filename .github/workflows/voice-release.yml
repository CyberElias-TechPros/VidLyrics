name: Verify production speech export
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/voice-release.yml'
      - 'apps/web/scripts/bundle-models.mjs'
      - 'apps/web/model-voices.json'
      - 'apps/web/src/media/**'
      - 'release-tests/**'
      - 'playwright.release.config.ts'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release-voice
      - name: Render restored two-voice project through native fallback
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          npm run render:native -- test-results/*/narration.vidlyricsproject "$RUNNER_TEMP/dialogue.mp4" test-results/*/narration.wav
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$RUNNER_TEMP/dialogue.mp4")" = aac
